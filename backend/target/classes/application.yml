server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: travel-planner-backend
  profiles:
    active: dev
  
  # Jackson formatting
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Database configuration (PostgreSQL by default with environment variable overrides)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travelplanner}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis / Cache configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: ${CACHE_TYPE:caffeine}
    cache-names: destinations,weather,exchangeRates,flights,hotels
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60m

# App Security & JWT
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  external-apis:
    openweather:
      api-key: ${OPENWEATHER_API_KEY:}
      base-url: https://api.openweathermap.org/data/2.5
    exchange-rates:
      api-key: ${EXCHANGE_RATES_API_KEY:}
      base-url: https://open.er-api.com/v6/latest
    amadeus:
      api-key: ${AMADEUS_API_KEY:}
      api-secret: ${AMADEUS_API_SECRET:}
    stripe:
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_travelplanner_mock}
      secret-key: ${STRIPE_SECRET_KEY:sk_test_travelplanner_mock}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
