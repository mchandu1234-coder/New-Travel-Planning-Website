server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: travel-planning-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:travelplanner;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

# App Security & JWT
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  external-apis:
    openweather:
      api-key: ${OPENWEATHER_API_KEY:}
      base-url: https://api.openweathermap.org/data/2.5
    exchange-rates:
      api-key: ${EXCHANGE_RATES_API_KEY:}
      base-url: https://open.er-api.com/v6/latest
    amadeus:
      api-key: ${AMADEUS_API_KEY:}
      api-secret: ${AMADEUS_API_SECRET:}
    stripe:
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_travelplanner_mock}
      secret-key: ${STRIPE_SECRET_KEY:sk_test_travelplanner_mock}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
server:
  port:  ${PORT:8080}
  address:  0.0.0.0