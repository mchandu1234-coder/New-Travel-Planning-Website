services:
  # 100% Free Spring Boot Backend Web Service
  - type: web
    name: wanderlust-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/destinations
    envVars:
      - key: PORT
        value: 8080
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"
